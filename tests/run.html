<!doctype html>
<html><head><meta charset="utf-8"><title>engine tests</title>
<style>body{font:13px/1.4 monospace;white-space:pre-wrap;padding:12px} .ok{color:#080} .fail{color:#c00;font-weight:bold}</style>
</head><body><div id="out"></div>
<script>document.write('<script src="../src/engine.js?ts=' + Date.now() + '"><\/script><script src="cases.js?ts=' + Date.now() + '"><\/script>')</script>
<script>
const out = document.getElementById('out');
const R = window.__results = { fails: 0, lines: [] };
function line(s, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s; out.appendChild(d); R.lines.push(s); }
function check(name, cond, detail) { if (cond) line('ok   ' + name + (detail ? '  ' + detail : ''), 'ok'); else { R.fails++; line('FAIL ' + name + (detail ? '  ' + detail : ''), 'fail'); } }
const E = STLRepair;
const sum = (a) => `naked=${a.nakedEdges} nm=${a.nonManifoldEdges} holesP=${a.planarHoles} holesNP=${a.nonPlanarHoles} inv=${a.invertedNormals} dup=${a.duplicateFaces} deg=${a.degenerateFaces} shells=${a.shells} conflicts=${a.orientationConflicts} V=${a.stats.vertices} T=${a.stats.triangles} vol=${a.stats.volume.toFixed(3)} wt=${a.stats.watertight}`;

function run(name, parsed, opts) {
  const r = E.repair(parsed, opts || {});
  line(`--- ${name}: ${r.ms.toFixed(0)} ms, iterations ${r.iterations}`);
  line(`    before: ${sum(r.before)}`);
  line(`    after : ${sum(r.after)}`);
  for (const l of r.log) line('    log: ' + l.t);
  return r;
}
runCases(E, run, check, sum);

async function real(name, fixedName) {
  const t0 = performance.now();
  const buf = await (await fetch('data/' + name)).arrayBuffer();
  const parsed = E.parseSTL(buf);
  line(`=== ${name}: ${parsed.format}, ${parsed.count} triangles, parse ${(performance.now() - t0).toFixed(0)} ms`);
  const r = run(name, parsed);
  window.__last = r;
  if (fixedName) {
    const b2 = await (await fetch('data/' + fixedName)).arrayBuffer();
    const p2 = E.parseSTL(b2);
    const mesh = E.weldExact(p2.tris, p2.count); const topo = E.buildTopology(mesh);
    const a = E.analyze(mesh, topo, { tol: 1e-6 * E.bbox(mesh.V, mesh.nv).diag, storedNormals: p2.normals });
    line(`    formware/other fixed file: ${sum(a)}`);
  }
  return r;
}
(async () => {
  try {
    await real('circular-picky-pad-mold.stl', 'circular-picky-pad-mold_fixed.stl');
    await real('y60.stl', 'y60_fixed.stl');
    await real('Defender110.stl', 'Defender110_fixed.stl');
    await real('cheesespiderererUNFIXED.stl', 'cheesespiderererFIXEDBELENDERe.stl');
    await real('3DBenchy.stl', null);
  } catch (e) { line('ERROR ' + e.message + '\n' + e.stack, 'fail'); R.fails++; }
  line(`DONE fails=${R.fails}`);
  R.done = true;
})();
</script></body></html>
